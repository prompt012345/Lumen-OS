
name: Build Lumen OS 2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Compiler Lumen OS
        run: |
          docker build -t lumen-toolchain docker
          mkdir -p build
          docker run --rm \
            -v "$PWD":/src \
            -v lumen-kbuild:/kbuild \
            lumen-toolchain \
            sh /src/docker/build-inside.sh

      - name: Vérifier les fichiers générés
        run: |
          test -s build/Image
          test -s build/initramfs.cpio
          file build/Image build/initramfs.cpio
          ls -lh build/

      - name: Publier les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: lumen-os-2-arm64
          path: |
            build/Image
            build/initramfs.cpio
          if-no-files-found: error
          retention-days: 14
